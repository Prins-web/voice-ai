<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dubbit – AI video translator</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef1f6;--ink:#14213d;--mute:#5b6682;--card:#fff;--line:#d5dbe8;--acc:#2f5bff;--hi:#ffe27a;--err:#c0262d}
@media (prefers-color-scheme:dark){:root{--bg:#0f1526;--ink:#e8ecf8;--mute:#9aa6c4;--card:#182038;--line:#2a3558;--acc:#6f8cff;--hi:#5b4b00;--err:#ff8a8f}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Bricolage Grotesque",system-ui,sans-serif}
header{padding:28px 20px 8px;max-width:1100px;margin:auto}
h1{margin:0;font-size:clamp(34px,6vw,60px);font-weight:800;letter-spacing:-.03em;line-height:1}
h1 span{color:var(--acc)}
header p{color:var(--mute);margin:10px 0 0;max-width:60ch}
main{max-width:1100px;margin:auto;padding:16px 20px 60px;display:grid;grid-template-columns:1.2fr 1fr;gap:20px}
@media(max-width:820px){main{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}
label{display:block;font-weight:600;font-size:14px;margin:12px 0 4px}
input,select,button{font:inherit;color:inherit}
input[type=password],input[type=text],select{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
video{width:100%;border-radius:12px;background:#000;max-height:380px}
.drop{display:block;border:2px dashed var(--line);border-radius:12px;padding:26px;text-align:center;cursor:pointer;color:var(--mute)}
.drop:hover,.drop:focus-within{border-color:var(--acc)}
.drop input{display:none}
button{cursor:pointer;border:0;border-radius:10px;padding:12px 18px;font-weight:600;background:var(--acc);color:#fff}
button.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
button:disabled{opacity:.5;cursor:not-allowed}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
#status{margin:12px 0 0;color:var(--mute);min-height:24px;font-size:14px}
#status.err{color:var(--err)}
.bar{height:4px;border-radius:2px;background:var(--line);overflow:hidden;margin-top:8px;display:none}
.bar i{display:block;height:100%;width:0;background:var(--acc);transition:width .3s}
#list{max-height:560px;overflow:auto;display:flex;flex-direction:column;gap:6px}
.seg{padding:8px 10px;border-radius:10px;cursor:pointer;border:1px solid transparent}
.seg:hover{border-color:var(--line)}
.seg.on{background:var(--hi)}
.seg small{display:block;color:var(--mute)}
.seg time{font-size:12px;color:var(--mute)}
.empty{color:var(--mute)}
.chk{display:flex;gap:8px;align-items:center;margin-top:12px;font-size:14px}
a{color:var(--acc)}
</style>
</head>
<body>
<header>
  <h1>Dub<span>bit</span></h1>
  <p>Upload a video, pick a language, and hear it dubbed with an AI voice. Your video never leaves your browser; only the audio is sent for transcription and translation.</p>
</header>

<main>
  <section class="card">
    <label class="drop" id="drop">
      <input type="file" id="file" accept="video/*,audio/*">
      <span id="dropText">Choose a video file, or drop it here</span>
    </label>
    <video id="vid" controls playsinline style="margin-top:14px;display:none"></video>

    <div class="row">
      <div>
        <label for="lang">Translate to</label>
        <select id="lang"></select>
      </div>
      <div>
        <label for="voice">Voice</label>
        <select id="voice"></select>
      </div>
    </div>

    <label for="key">Groq API key (free) · <a href="https://console.groq.com/keys" target="_blank" rel="noopener">get one</a></label>
    <input type="password" id="key" placeholder="gsk_…" autocomplete="off">

    <label class="chk"><input type="checkbox" id="orig"> Keep original audio quietly in the background</label>

    <div class="actions">
      <button id="go" disabled>Translate video</button>
      <button id="srt" class="ghost" disabled>Download subtitles (.srt)</button>
    </div>
    <div class="bar" id="bar"><i id="barI"></i></div>
    <p id="status" role="status"></p>
  </section>

  <section class="card">
    <strong>Transcript</strong>
    <div id="list"><p class="empty">The original and translated lines will appear here. Click a line to jump to it.</p></div>
  </section>
</main>

<script>
const $=id=>document.getElementById(id);
const LANGS={Hindi:'hi-IN',English:'en-US',Gujarati:'gu-IN',Marathi:'mr-IN',Bengali:'bn-IN',Tamil:'ta-IN',Telugu:'te-IN',Urdu:'ur-PK',Spanish:'es-ES',French:'fr-FR',German:'de-DE',Portuguese:'pt-BR',Russian:'ru-RU',Arabic:'ar-SA',Chinese:'zh-CN',Japanese:'ja-JP',Korean:'ko-KR'};
const v=$('vid');
let file=null,segs=[],idx=-1,playing=false;

// setup
Object.keys(LANGS).forEach(l=>$('lang').add(new Option(l,l)));
try{$('key').value=localStorage.getItem('groqKey')||''}catch(e){}
$('key').addEventListener('change',()=>{try{localStorage.setItem('groqKey',$('key').value.trim())}catch(e){}});

function status(m,err){const s=$('status');s.textContent=m;s.className=err?'err':''}
function progress(p){$('bar').style.display=p>0&&p<1?'block':'none';$('barI').style.width=(p*100)+'%'}

// voices
function loadVoices(){
  const code=LANGS[$('lang').value].split('-')[0];
  const list=speechSynthesis.getVoices().filter(x=>x.lang.toLowerCase().startsWith(code));
  const sel=$('voice');sel.innerHTML='';
  list.forEach(x=>sel.add(new Option(x.name+' ('+x.lang+')',x.voiceURI)));
  if(!list.length)sel.add(new Option('Default voice',''));
}
speechSynthesis.onvoiceschanged=loadVoices;
$('lang').addEventListener('change',()=>{loadVoices();if(segs.length)status('Language changed. Press “Translate video” again.')});
loadVoices();

// file handling
function setFile(f){
  if(!f)return;file=f;segs=[];$('dropText').textContent=f.name;
  v.src=URL.createObjectURL(f);v.style.display='block';
  $('go').disabled=false;$('srt').disabled=true;
  $('list').innerHTML='<p class="empty">Ready. Press “Translate video”.</p>';
}
$('file').addEventListener('change',e=>setFile(e.target.files[0]));
['dragover','drop'].forEach(ev=>$('drop').addEventListener(ev,e=>{e.preventDefault();if(ev==='drop')setFile(e.dataTransfer.files[0])}));

// audio extraction: decode, downmix, resample to 16 kHz mono WAV
async function toWav(f){
  const buf=await f.arrayBuffer();
  const ac=new (window.AudioContext||window.webkitAudioContext)();
  const dec=await ac.decodeAudioData(buf);ac.close();
  const MAX=12*60,dur=Math.min(dec.duration,MAX);
  const off=new OfflineAudioContext(1,Math.ceil(dur*16000),16000);
  const src=off.createBufferSource();src.buffer=dec;src.connect(off.destination);src.start();
  const r=await off.startRendering();
  return {blob:encodeWav(r.getChannelData(0),16000),clipped:dec.duration>MAX};
}
function encodeWav(f,sr){
  const n=f.length,b=new DataView(new ArrayBuffer(44+n*2));
  const w=(o,s)=>[...s].forEach((c,i)=>b.setUint8(o+i,c.charCodeAt(0)));
  w(0,'RIFF');b.setUint32(4,36+n*2,true);w(8,'WAVEfmt ');b.setUint32(16,16,true);
  b.setUint16(20,1,true);b.setUint16(22,1,true);b.setUint32(24,sr,true);b.setUint32(28,sr*2,true);
  b.setUint16(32,2,true);b.setUint16(34,16,true);w(36,'data');b.setUint32(40,n*2,true);
  for(let i=0;i<n;i++){const s=Math.max(-1,Math.min(1,f[i]));b.setInt16(44+i*2,s<0?s*0x8000:s*0x7fff,true)}
  return new Blob([b],{type:'audio/wav'});
}

// AI calls (Groq: fast Whisper + Llama)
async function transcribe(blob,key){
  const fd=new FormData();
  fd.append('file',blob,'audio.wav');fd.append('model','whisper-large-v3-turbo');
  fd.append('response_format','verbose_json');fd.append('timestamp_granularities[]','segment');
  const r=await fetch('https://api.groq.com/openai/v1/audio/transcriptions',{method:'POST',headers:{Authorization:'Bearer '+key},body:fd});
  if(!r.ok)throw new Error('Transcription failed: '+(await r.text()).slice(0,160));
  const j=await r.json();
  return (j.segments||[]).map(s=>({start:s.start,end:s.end,text:s.text.trim()})).filter(s=>s.text);
}
async function translateChunk(items,lang,key){
  const r=await fetch('https://api.groq.com/openai/v1/chat/completions',{method:'POST',
    headers:{'Content-Type':'application/json',Authorization:'Bearer '+key},
    body:JSON.stringify({model:'llama-3.3-70b-versatile',temperature:0.2,response_format:{type:'json_object'},
      messages:[{role:'system',content:`You are a professional dubbing translator. Translate each line into natural, spoken ${lang}. Keep each line short enough to say in the same time. Reply only with JSON: {"lines":["..."]} with exactly the same number of lines in the same order.`},
      {role:'user',content:JSON.stringify(items)}]})});
  if(!r.ok)throw new Error('Translation failed: '+(await r.text()).slice(0,160));
  const j=await r.json();
  return JSON.parse(j.choices[0].message.content).lines||[];
}
async function translateAll(list,lang,key){
  const chunks=[];for(let i=0;i<list.length;i+=30)chunks.push(list.slice(i,i+30));
  const out=await Promise.all(chunks.map(c=>translateChunk(c.map(s=>s.text),lang,key)));
  let k=0;chunks.forEach((c,ci)=>c.forEach((s,i)=>{s.tr=(out[ci][i]||s.text);k++}));
}

// main flow
$('go').addEventListener('click',async()=>{
  const key=$('key').value.trim();
  if(!key)return status('Add your free Groq API key first.',true);
  $('go').disabled=true;speechSynthesis.cancel();v.pause();
  try{
    status('Preparing audio…');progress(.15);
    const {blob,clipped}=await toWav(file);
    status('Transcribing speech…');progress(.4);
    segs=await transcribe(blob,key);
    if(!segs.length)throw new Error('No speech found in this video.');
    status('Translating to '+$('lang').value+'…');progress(.75);
    await translateAll(segs,$('lang').value,key);
    progress(1);render();$('srt').disabled=false;
    status('Done. Press play on the video.'+(clipped?' Only the first 12 minutes were translated.':''));
    if(!speechSynthesis.getVoices().length)status('Done, but this browser has no speech voices. Try Chrome or Edge.',true);
  }catch(e){status(e.message,true);progress(0)}
  $('go').disabled=false;
});

function fmt(t){const m=Math.floor(t/60),s=Math.floor(t%60);return m+':'+String(s).padStart(2,'0')}
function render(){
  const l=$('list');l.innerHTML='';
  segs.forEach((s,i)=>{
    const d=document.createElement('div');d.className='seg';d.id='s'+i;
    const t=document.createElement('time');t.textContent=fmt(s.start);
    const a=document.createElement('div');a.textContent=s.tr;
    const o=document.createElement('small');o.textContent=s.text;
    d.append(t,a,o);d.onclick=()=>{v.currentTime=s.start;v.play()};l.append(d);
  });
}

// dubbed playback synced to the video
function say(s){
  const code=LANGS[$('lang').value];
  const u=new SpeechSynthesisUtterance(s.tr);u.lang=code;
  const vo=speechSynthesis.getVoices().find(x=>x.voiceURI===$('voice').value);if(vo)u.voice=vo;
  const cps=/^(zh|ja|ko)/.test(code)?5:14;
  u.rate=Math.max(.9,Math.min(1.8,(s.tr.length/cps)/Math.max(.5,s.end-s.start)));
  speechSynthesis.speak(u);
}
function tick(){
  if(!playing)return;
  const t=v.currentTime,i=segs.findIndex(s=>t>=s.start&&t<s.end);
  if(i!==idx){
    idx=i;
    if(i>=0){speechSynthesis.cancel();say(segs[i]);
      document.querySelectorAll('.seg.on').forEach(e=>e.classList.remove('on'));
      const e=$('s'+i);e.classList.add('on');e.scrollIntoView({block:'nearest'})}
  }
  requestAnimationFrame(tick);
}
function applyVolume(){v.muted=false;v.volume=$('orig').checked?.15:0;if(!$('orig').checked)v.muted=true}
$('orig').addEventListener('change',applyVolume);
v.addEventListener('play',()=>{if(!segs.length)return;applyVolume();playing=true;idx=-1;tick()});
['pause','ended','seeking'].forEach(ev=>v.addEventListener(ev,()=>{playing=false;idx=-1;speechSynthesis.cancel();if(ev==='seeking'&&!v.paused){playing=true;tick()}}));

// subtitles
$('srt').addEventListener('click',()=>{
  const ts=t=>{const h=Math.floor(t/3600),m=Math.floor(t%3600/60),s=Math.floor(t%60),ms=Math.floor(t%1*1000);
    return [h,m,s].map(x=>String(x).padStart(2,'0')).join(':')+','+String(ms).padStart(3,'0')};
  const txt=segs.map((s,i)=>`${i+1}\n${ts(s.start)} --> ${ts(s.end)}\n${s.tr}\n`).join('\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:'text/plain'}));
  a.download=(file?file.name.replace(/\.[^.]+$/,''):'video')+'-'+$('lang').value+'.srt';a.click();
});
</script>
</body>
</html>
